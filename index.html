<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游泳社团签到</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#172033;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:22px 16px;color:#fff;text-align:center;background:linear-gradient(135deg,#006494,#00a6c7)}h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.9}.tabs{display:flex;position:sticky;top:0;background:#fff;border-bottom:1px solid #d9e2ec}.tab{flex:1;padding:13px;border:0;border-bottom:3px solid transparent;background:#fff;color:#64748b;font:inherit;font-weight:700}.tab.active{color:#0077b6;border-color:#0077b6}main{max-width:820px;margin:auto;padding:16px}.panel{display:none}.panel.active{display:block}.card{margin-bottom:14px;padding:16px;background:#fff;border:1px solid #e7edf3;border-radius:8px}.title{margin-bottom:14px;font-size:16px;font-weight:800}.controls,.stats,.venues{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:block;margin-bottom:5px;color:#64748b;font-size:12px;font-weight:700}input,select{width:100%;min-height:39px;padding:8px;border:1px solid #bfcbd7;border-radius:6px;background:#fff;font:inherit}.stats{grid-template-columns:repeat(3,1fr);margin:16px 0}.stat{padding:9px 5px;border-radius:7px;background:#f1f5f9;text-align:center;font-size:12px;font-weight:700}.stat b{display:block;font-size:23px}.green{color:#16803a;background:#dcfce7}.blue{color:#175da6;background:#dbeafe}.red{color:#c2382b;background:#fef2f2}.hint{margin:0 0 12px;color:#64748b;font-size:12px;text-align:center}.members{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.member{min-height:48px;padding:10px 7px;border:2px solid transparent;border-radius:7px;background:#f1f5f9;color:#172033;font:inherit;font-weight:700}.member.checked{border-color:#22c55e;background:#dcfce7;color:#16803a}.member.month{border-color:#7bb9ed;background:#eaf4ff;color:#175da6}.venue{padding:12px;border-left:4px solid #0077b6;background:#f8fbfd;line-height:1.8}.venue b{display:block;font-size:15px}.head{margin:15px 0 8px;color:#0077b6;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 9px;border-radius:6px;background:#dcfce7;color:#16803a;font-weight:700}.chip.top{background:#fef3c7;color:#9a6700}.chip.no{background:#fef2f2;color:#c2382b}.record{margin-bottom:8px;padding:12px;border-left:4px solid #0077b6;background:#f8fafc}.record small{color:#64748b}.badge{padding:2px 6px;border-radius:4px;background:#dff4fb;color:#075985;font-weight:800}.empty{padding:28px;color:#64748b;text-align:center}.bar,.toast{display:none;position:fixed;z-index:5;color:#fff;text-align:center}.bar{top:0;left:0;right:0;padding:6px;background:#0077b6}.bar.error{background:#c2382b}.toast{left:50%;bottom:28px;transform:translateX(-50%);padding:10px 17px;border-radius:6px;background:#172033}.show{display:block}.dialog{display:none;align-items:center;justify-content:center;position:fixed;inset:0;z-index:4;padding:20px;background:#0008}.dialog.show{display:flex}.box{width:100%;max-width:330px;padding:22px;border-radius:8px;background:#fff;text-align:center}.box h2{margin:5px}.box p{color:#64748b}.actions{display:flex;gap:8px}.actions button{flex:1;padding:11px;border:0;border-radius:6px;font:inherit;font-weight:800}.confirm{color:#fff;background:#0077b6}@media(min-width:680px){.members{grid-template-columns:repeat(4,1fr)}.venues{grid-template-columns:repeat(3,1fr)}}@media(max-width:380px){.controls,.venues{grid-template-columns:1fr}}
</style></head><body>
<div class="bar" id="bar"></div><header><h1>游泳社团签到</h1><p>场馆签到 · 出勤记录</p></header><nav class="tabs"><button class="tab active" data-tab="checkin">签到</button><button class="tab" data-tab="records">活动记录</button></nav><main>
<section class="panel active" id="checkin"><div class="card"><div class="title">签到</div><div class="controls"><div><label>签到日期</label><input id="date" type="date"></div><div><label>活动场馆</label><select id="venue"></select></div></div><div class="stats" id="stats"></div><p class="hint" id="hint"></p><div class="members" id="members"></div></div></section>
<section class="panel" id="records"><div class="controls" style="margin-bottom:14px"><div><label>查看月份</label><select id="month"></select></div></div><div class="card"><div class="title">场馆活动概览</div><p class="hint">分别统计各场馆的活动场次、签到人次和参与成员。</p><div class="venues" id="overview"></div></div><div class="card"><div class="title">成员场馆出勤</div><div id="summary"></div></div><div class="card"><div class="title">签到明细</div><div id="details"></div></div></section></main>
<div class="dialog" id="dialog"><div class="box"><h2 id="person"></h2><p id="confirmText"></p><div class="actions"><button id="cancel">取消</button><button class="confirm" id="confirm">确认签到</button></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://fqsibxdlpithwrjqpdnp.supabase.co','sb_publishable_ndAQnv8n_7rwy8xn40PW7A_umLjS4A9');
const members=['陈德灏','丁枭','黄佳妮','黄唯展','罗立','罗森礼','毛祖秋','彭博','青格勒','王海波','王华栋','王庆涛','王洋','谢满山','杨同鹏','于凯凯','喻小龙','张璐怡','郑丹丹','周建中','曹帆','韦海云','陈旭博'], venues=['上海游泳馆','周浦游泳馆'], legacy='未标注场馆',homeVenue={'于凯凯':'周浦','王庆涛':'周浦'};let data=[],pending='',day='',venue=venues[0],month='';const $=id=>document.getElementById(id),ym=d=>(d||'').slice(0,7),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',2400)}function sync(t,e){$('bar').textContent=t;$('bar').className=t?'bar show'+(e?' error':''):'bar'}function event(d,v){return data.find(x=>x.date===d&&x.venue===v)}
async function load(silent){if(!silent)sync('加载数据中...');try{let r=await db.from('checkins').select('date,name,venue');if(r.error)throw r.error;let map={};r.data.forEach(x=>{let v=x.venue||legacy,k=x.date+'\0'+v;(map[k]??={date:x.date,venue:v,attendees:[]}).attendees.push(x.name)});data=Object.values(map);if(!silent)sync('');return true}catch(e){console.warn(e);if(!silent){sync('加载失败，请稍后重试',true);setTimeout(()=>sync(''),3500)}return false}}
async function save(){sync('保存签到中...');try{let r=await db.from('checkins').upsert({date:day,name:pending,venue},{onConflict:'date,name,venue',ignoreDuplicates:true});if(r.error)throw r.error;sync('');return true}catch(e){console.warn(e);sync('保存失败：请先执行场馆数据库迁移',true);setTimeout(()=>sync(''),4500);return false}}
function checkin(){let e=event(day,venue),signed=e?e.attendees:[],active=new Set(data.filter(x=>ym(x.date)===ym(today())&&x.venue===venue).flatMap(x=>x.attendees));$('date').value=day;$('stats').innerHTML=`<div class="stat green"><b>${signed.length}</b>${day===today()?'今日签到':'该日签到'}</div><div class="stat blue"><b>${active.size}</b>本月场馆活跃</div><div class="stat red"><b>${members.length-active.size}</b>本月未参与</div>`;$('hint').textContent=`${venue}：绿色为本次已签，蓝色为本月曾参与`;$('members').innerHTML=members.map(n=>`<button class="member ${signed.includes(n)?'checked':active.has(n)?'month':''}" data-name="${esc(n)}">${esc(n)}${homeVenue[n]?`（${homeVenue[n]}）`:''}</button>`).join('');document.querySelectorAll('.member').forEach(b=>b.onclick=()=>{if(signed.includes(b.dataset.name))return toast(`${b.dataset.name} 已在本场馆完成签到`);pending=b.dataset.name;$('person').textContent=pending;$('confirmText').textContent=`${day}${day!==today()?'（补签）':''} · ${venue}`;$('dialog').className='dialog show'})}
function fillMonth(){let ms=[...new Set([ym(today()),...data.map(x=>ym(x.date)).filter(Boolean)])].sort().reverse();if(!ms.includes(month))month=ms[0];$('month').innerHTML=ms.map(m=>`<option value="${m}"${m===month?' selected':''}>${m.slice(0,4)} 年 ${+m.slice(5)} 月${m===ym(today())?'（本月）':''}</option>`).join('')}
function records(){let es=data.filter(x=>ym(x.date)===month).sort((a,b)=>b.date.localeCompare(a.date)||a.venue.localeCompare(b.venue)),vs=[...venues,...es.map(x=>x.venue).filter(v=>!venues.includes(v))];$('overview').innerHTML=vs.map(v=>{let a=es.filter(x=>x.venue===v),p=new Set(a.flatMap(x=>x.attendees)),n=a.reduce((s,x)=>s+x.attendees.length,0);return `<div class="venue"><b>${esc(v)}</b>活动场次：${a.length}<br>签到人次：${n}<br>参与成员：${p.size} 人</div>`}).join('');let h=`<p class="hint">本月共 ${es.length} 场已记录活动，${new Set(es.flatMap(x=>x.attendees)).size} 位成员参与。</p>`;vs.forEach(v=>{let c={};es.filter(x=>x.venue===v).forEach(x=>x.attendees.forEach(n=>c[n]=(c[n]||0)+1));let max=Math.max(0,...Object.values(c));h+=`<div class="head">${esc(v)}（${Object.keys(c).length} 人）</div><div class="chips">${Object.keys(c).length?members.filter(n=>c[n]).sort((a,b)=>c[b]-c[a]).map(n=>`<span class="chip ${c[n]===max?'top':''}">${esc(n)} (${c[n]}次)</span>`).join(''):'暂无签到记录'}</div>`});let seen=new Set(es.flatMap(x=>x.attendees)),abs=members.filter(n=>!seen.has(n));if(abs.length)h+=`<div class="head" style="color:#c2382b">本月尚未参与（${abs.length} 人）</div><div class="chips">${abs.map(n=>`<span class="chip no">${esc(n)}</span>`).join('')}</div>`;$('summary').innerHTML=h;$('details').innerHTML=es.length?es.map(x=>`<div class="record"><small>${esc(x.date)} <span class="badge">${esc(x.venue)}</span></small><div>${x.attendees.length} 人：${x.attendees.map(esc).join('、')}</div></div>`).join(''):'<div class="empty">该月暂无签到记录</div>'}
function active(){document.querySelector('.tab.active').dataset.tab==='checkin'?checkin():records()}async function init(){day=today();$('venue').innerHTML=venues.map(v=>`<option>${v}</option>`).join('');$('date').min=ym(today())+'-01';$('date').max=today();$('date').onchange=e=>{let d=e.target.value;if(!d||ym(d)!==ym(today())||d>today()){toast('只能补签本月且不超过今天的日期');e.target.value=day}else{day=d;checkin()}};$('venue').onchange=e=>{venue=e.target.value;checkin()};$('month').onchange=e=>{month=e.target.value;records()};document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');await load(true);fillMonth();active()});$('cancel').onclick=()=>{$('dialog').className='dialog';pending=''};$('confirm').onclick=async()=>{if(!pending)return;$('dialog').className='dialog';if(await save()){await load(true);fillMonth();checkin();toast(`${pending} 签到成功`)}pending=''};await load();fillMonth();checkin();setInterval(async()=>{if(await load(true)){fillMonth();active()}},30000)}init();
</script></body></html>
